<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVERLAY BANPICK</title>
    <!-- component styles: edit each file on its own -->
    <link rel="stylesheet" href="styles/banpick/base.css?v=16" />
    <link rel="stylesheet" href="styles/banpick/scorebar.css?v=20" />
    <link rel="stylesheet" href="styles/banpick/bans.css?v=17" />
    <link rel="stylesheet" href="styles/banpick/timerbar.css?v=17" />
    <link rel="stylesheet" href="styles/banpick/pickcards.css?v=35" />
    <link rel="stylesheet" href="styles/banpick/center.css?v=22" />
    <link rel="stylesheet" href="styles/banpick/intro.css?v=5" />
  </head>
  <body>
    <div id="stage">
      <div class="overlay">
        <!-- ============ SCORE BAR ============ -->
        <div class="scorebar">
          <!-- bans blue (far left) -->
          <div class="ban-group ban-left">
            <div class="banhero">
              <div id="image-box-11" class="image-box">
                <img id="image-display-11" src="" />
              </div>
              <div id="ban-left-1" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-12" class="image-box">
                <img id="image-display-12" src="" />
              </div>
              <div id="ban-left-2" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-13" class="image-box">
                <img id="image-display-13" src="" />
              </div>
              <div id="ban-left-3" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-14" class="image-box">
                <img id="image-display-14" src="" />
              </div>
              <div id="ban-left-4" class="box2 ban0"></div>
            </div>
          </div>

          <!-- match info (center) -->
          <div class="matchinfo">
            <div class="team-name blue" id="name-box-1"></div>
            <div class="team-score" id="name-box-2"></div>
            <img
              class="ups-logo"
              src="assets/ui/ups-logo.png"
              alt="UPS LEGENDS"
            />
            <div class="team-score" id="name-box-9"></div>
            <div class="team-name red" id="name-box-8"></div>
          </div>

          <!-- bans red (far right) -->
          <div class="ban-group ban-right">
            <div class="banhero">
              <div id="image-box-19" class="image-box">
                <img id="image-display-19" src="" />
              </div>
              <div id="ban-right-4" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-18" class="image-box">
                <img id="image-display-18" src="" />
              </div>
              <div id="ban-right-3" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-17" class="image-box">
                <img id="image-display-17" src="" />
              </div>
              <div id="ban-right-2" class="box2 ban0"></div>
            </div>
            <div class="banhero">
              <div id="image-box-16" class="image-box">
                <img id="image-display-16" src="" />
              </div>
              <div id="ban-right-1" class="box2 ban0"></div>
            </div>
          </div>
        </div>

        <!-- ============ TIMER BAR ============ -->
        <div class="timerbar"><div id="timer-bar"></div></div>

        <!-- ============ PICK ROW ============ -->
        <div class="pickrow">
          <!-- picks blue -->
          <div class="pick-group pick-left">
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-1" class="image-box">
                <img id="image-display-1" src="" />
              </div>
              <div id="pick-left-1" class="box pick"></div>
              <div class="nameplate" id="name-box-3"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-2" class="image-box">
                <img id="image-display-2" src="" />
              </div>
              <div id="pick-left-2" class="box pick"></div>
              <div class="nameplate" id="name-box-4"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-3" class="image-box">
                <img id="image-display-3" src="" />
              </div>
              <div id="pick-left-3" class="box pick"></div>
              <div class="nameplate" id="name-box-5"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-4" class="image-box">
                <img id="image-display-4" src="" />
              </div>
              <div id="pick-left-4" class="box pick"></div>
              <div class="nameplate" id="name-box-6"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-5" class="image-box">
                <img id="image-display-5" src="" />
              </div>
              <div id="pick-left-5" class="box pick"></div>
              <div class="nameplate" id="name-box-7"></div>
            </div>
          </div>

          <!-- center: cup + round/BO plate -->
          <div class="center">
            <div class="cup-wrap">
              <img class="cup" src="assets/ui/cup.png" alt="Cup" />
              <span class="cup-sparkle s1"></span>
              <span class="cup-sparkle s2"></span>
              <span class="cup-sparkle s3"></span>
              <span class="cup-sparkle s4"></span>
              <span class="cup-sparkle s5"></span>
            </div>
            <div class="bo-plate">
              <div id="boDisplay"></div>
            </div>
          </div>

          <!-- picks red -->
          <div class="pick-group pick-right">
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-10" class="image-box">
                <img id="image-display-10" src="" />
              </div>
              <div id="pick-right-5" class="box pick"></div>
              <div class="nameplate" id="name-box-14"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-9" class="image-box">
                <img id="image-display-9" src="" />
              </div>
              <div id="pick-right-4" class="box pick"></div>
              <div class="nameplate" id="name-box-13"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-8" class="image-box">
                <img id="image-display-8" src="" />
              </div>
              <div id="pick-right-3" class="box pick"></div>
              <div class="nameplate" id="name-box-12"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-7" class="image-box">
                <img id="image-display-7" src="" />
              </div>
              <div id="pick-right-2" class="box pick"></div>
              <div class="nameplate" id="name-box-11"></div>
            </div>
            <div class="heropick">
              <div class="icon-lane"></div>
              <div id="image-box-6" class="image-box">
                <img id="image-display-6" src="" />
              </div>
              <div id="pick-right-1" class="box pick"></div>
              <div class="nameplate" id="name-box-10"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- /.overlay -->

      <!-- offscreen: legacy 5th ban slots, team logos, phase text, turn arrow/countdown -->
      <div class="hide">
        <div id="image-box-15" class="image-box">
          <img id="image-display-15" src="" />
        </div>
        <div id="ban-left-5" class="box ban0"></div>
        <div id="image-box-20" class="image-box">
          <img id="image-display-20" src="" />
        </div>
        <div id="ban-right-5" class="box ban0"></div>
        <img id="displayImage1" src="" alt="Logo 1" />
        <img id="displayImage2" src="" alt="Logo 2" />
        <img id="arrow" src="" alt="Direction" />
        <p class="countdown"><span id="timer">60</span></p>
        <h2 id="phase"></h2>
      </div>
    </div>
    <!-- /#stage -->

    <audio id="hero-voice" hidden></audio>
    <audio id="sfx-audio" hidden></audio>

    <script src="scripts/wsClient.js"></script>
    <script src="scripts/banpick.js?v=20"></script>
    <script src="scripts/pickflow.js?v=4"></script>
  </body>
</html>
